<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hypen Vault Downloader</title>

    <!-- Base href disesuaikan untuk Render.com (Root Domain) -->
    <base href="/" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/rdmmoonlight/hypen/main/apps/mobile/Resources/AppIcon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Custom Stylesheet (Dimuat dari wwwroot/theme.css atau wwwroot/css/app.css) -->
    <link rel="stylesheet" href="theme.css?v=7.0" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="Hypen.Web.styles.css" />

    <HeadOutlet />
</head>

<body>
    <!-- Target Mounting Blazor -->
    <div id="app">
        <Router AppAssembly="@typeof(App).Assembly">
            <Found Context="routeData">
                <RouteView RouteData="@routeData" DefaultLayout="@typeof(MainLayout)" />
                <FocusOnNavigate RouteData="@routeData" Selector="h1" />
            </Found>
            <NotFound>
                <PageTitle>Not found</PageTitle>
                <LayoutView Type="@typeof(MainLayout)">
                    <p role="alert" style="padding: 20px; color: var(--text-secondary);">Maaf, halaman tidak ditemukan.</p>
                </LayoutView>
            </NotFound>
        </Router>
    </div>

    <!-- UI Handler Error Bawaan Blazor -->
    <div id="blazor-error-ui" style="display: none;">
        Terjadi kesalahan yang tidak ditangani.
        <a href="" class="reload">Muat Ulang</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Helper JS Interop untuk Download File -->
    <script>
        window.triggerFileDownload = (url, fileName) => {
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = fileName || 'download';
            anchor.target = '_blank';
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        };
    </script>

    <!-- Script Utama Runtime Blazor Engine -->
    <script src="_framework/blazor.web.js"></script>
</body>
</html>
