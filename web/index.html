<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hypen Vault Player</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="theme.css?v=7.0">

  <script>
    window.ENV_BACKEND_URL = window.ENV_BACKEND_URL || "";
  </script>
  <script src="config.js" async onerror="console.log('config.js tidak ada, memakai fallback')"></script>
</head>
<body>

  <main class="main-container">
    <!-- Input Track Single -->
    <div class="input-group">
      <h3 class="nebula-title">Import Single Track</h3>
      <div class="input-inline">
        <input type="text" id="ytUrl" placeholder="Tempel link video YouTube...">
        <button class="btn-nebula" onclick="convertVideo()">+ Add Track</button>
      </div>
    </div>

    <!-- Input Playlist YouTube -->
    <div class="input-group">
      <h3 class="nebula-title">Import YouTube Playlist</h3>
      <div class="input-inline">
        <input type="text" id="playlistUrl" placeholder="Tempel link playlist YouTube...">
        <button class="btn-nebula btn-secondary" onclick="convertPlaylist()">+ Import Playlist</button>
      </div>
    </div>

    <p id="status" class="status-msg"></p>

    <!-- Controls Bar: Search & Mass Action -->
    <div class="controls-bar input-group">
      <div class="input-inline" style="margin-bottom: 10px;">
        <input type="text" id="searchInput" placeholder="🔍 Cari judul lagu atau artis..." oninput="filterSongs()">
      </div>
      <div class="action-buttons-inline">
        <label><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"> Pilih Semua</label>
        <button class="btn-nebula btn-secondary" onclick="downloadSelected()">📥 Download Selected</button>
        <button class="btn-nebula" style="background: crimson;" onclick="deleteSelected()">🗑️ Hapus Selected</button>
      </div>
    </div>

    <h3 class="nebula-title section-header">Library Collection</h3>
    <div id="libraryList" class="card-grid"></div>
  </main>

  <!-- Player Bar -->
  <div class="player-bar">
    <div id="nowPlaying" class="now-playing">No track selected...</div>
    <audio id="audioPlayer" controls></audio>
  </div>

  <script>
    let allSongsData = [];

    function getBackendUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return window.ENV_BACKEND_URL || urlParams.get('api') || "https://hypen-0s65.onrender.com";
    }

    function setStatus(msg, isError = false) {
      const statusEl = document.getElementById('status');
      statusEl.innerText = msg;
      statusEl.style.color = isError ? '#f72585' : '#4cc9f0';
    }

    async function loadLibrary() {
      const baseUrl = getBackendUrl();
      try {
        setStatus('Memuat library...');
        const res = await fetch(`${baseUrl}/api/songs`);
        if (!res.ok) throw new Error(`Server status ${res.status}`);

        allSongsData = await res.json();
        renderSongs(allSongsData);
        setStatus('');
      } catch (e) {
        console.error("Fetch Library Error:", e);
        setStatus(`Gagal memuat library (${e.message}).`, true);
      }
    }

    function renderSongs(songs) {
      const container = document.getElementById('libraryList');
      container.innerHTML = '';

      if (!Array.isArray(songs) || songs.length === 0) {
        container.innerHTML = '<p style="color: var(--text-secondary); text-align: center;">Tidak ada lagu ditemukan.</p>';
        return;
      }

      songs.forEach(song => {
        const title = song.title || 'Untitled';
        const artist = song.artist || 'Unknown';
        const cover = song.cover || '';
        const audioUrl = song.audioUrl || '';
        const id = song.id;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <input type="checkbox" class="song-checkbox" data-id="${id}" data-url="${audioUrl}" data-title="${title.replace(/"/g, '&quot;')}">
          <img src="${cover}" class="card-img" alt="Cover" onerror="this.src='https://via.placeholder.com/50/141226/f0f3ff?text=♫'">
          <div class="card-info">
            <div class="card-title"></div>
            <div class="card-artist"></div>
          </div>
          <div class="card-actions">
            <button class="btn-nebula" onclick="playSong('${audioUrl}', \`${title.replace(/`/g, '\\`')}\`, \`${artist.replace(/`/g, '\\`')}\`, '${cover}')">▶</button>
            <button class="btn-nebula btn-secondary" onclick="downloadSingle('${audioUrl}', \`${title.replace(/`/g, '\\`')}\`)">📥</button>
            <button class="btn-nebula" style="background: #4a0000; border-color: #8b0000;" onclick="deleteSingle(${id})">🗑️</button>
          </div>
        `;

        card.querySelector('.card-title').textContent = title;
        card.querySelector('.card-artist').textContent = artist;
        container.appendChild(card);
      });
    }

    function filterSongs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allSongsData.filter(song => 
        (song.title && song.title.toLowerCase().includes(query)) ||
        (song.artist && song.artist.toLowerCase().includes(query))
      );
      renderSongs(filtered);
    }

    function toggleSelectAll(master) {
      document.querySelectorAll('.song-checkbox').forEach(cb => cb.checked = master.checked);
    }

    // Direct Download MP3 Paralel Masif
    function downloadSelected() {
      const selected = document.querySelectorAll('.song-checkbox:checked');
      if (selected.length === 0) return alert('Pilih minimal 1 lagu!');

      let delay = 0;
      selected.forEach(cb => {
        const url = cb.getAttribute('data-url');
        const title = cb.getAttribute('data-title');
        setTimeout(() => {
          downloadSingle(url, title);
        }, delay);
        delay += 600; // Jeda aman 0.6 detik antar unduhan
      });
    }

    // Perbaikan: Fetch file secara Async lalu unduh via Blob agar tidak membuka tab baru
    async function downloadSingle(url, title) {
      if (!url) return alert('URL audio tidak valid.');
      
      try {
        setStatus(`Mengunduh: ${title}...`);
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const blob = await res.blob();
        const blobUrl = window.URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = blobUrl;
        a.download = `${title || 'track'}.mp3`;
        document.body.appendChild(a);
        a.click();

        // Clean up
        window.URL.revokeObjectURL(blobUrl);
        document.body.removeChild(a);
        setStatus(`Berhasil mengunduh: ${title}`);
        setTimeout(() => setStatus(''), 3000);
      } catch (err) {
        console.error("Download Error:", err);
        // Fallback: Jika CORS memblokir Fetch, buka via window.open sebagai opsi cadangan
        const fallbackAnchor = document.createElement('a');
        fallbackAnchor.href = url;
        fallbackAnchor.download = `${title}.mp3`;
        fallbackAnchor.target = "_blank";
        fallbackAnchor.click();
        setStatus('');
      }
    }

    async function deleteSingle(id) {
      if (!confirm('Yakin ingin menghapus lagu ini dari library?')) return;
      const baseUrl = getBackendUrl();
      try {
        const res = await fetch(`${baseUrl}/api/songs/${id}`, { method: 'DELETE' });
        if (res.ok) {
          loadLibrary();
        } else {
          alert('Gagal menghapus lagu.');
        }
      } catch (e) {
        alert('Error menghapus lagu.');
      }
    }

    async function deleteSelected() {
      const selected = Array.from(document.querySelectorAll('.song-checkbox:checked')).map(cb => parseInt(cb.getAttribute('data-id')));
      if (selected.length === 0) return alert('Pilih minimal 1 lagu!');
      if (!confirm(`Yakin ingin menghapus ${selected.length} lagu terpilih?`)) return;

      const baseUrl = getBackendUrl();
      try {
        const res = await fetch(`${baseUrl}/api/songs/delete-batch`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids: selected })
        });
        if (res.ok) {
          document.getElementById('selectAll').checked = false;
          loadLibrary();
        } else {
          alert('Gagal menghapus lagu terpilih.');
        }
      } catch (e) {
        alert('Error menghapus lagu terpilih.');
      }
    }

    async function convertVideo() {
      const url = document.getElementById('ytUrl').value;
      if (!url) return alert('Masukkan URL YouTube!');
      setStatus('Memproses track...');
      const baseUrl = getBackendUrl();
      try {
        const res = await fetch(`${baseUrl}/api/convert`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ youtubeUrl: url })
        });
        if (res.ok) {
          setStatus('Track berhasil ditambahkan!');
          document.getElementById('ytUrl').value = '';
          loadLibrary();
        } else {
          setStatus('Gagal mengonversi video.', true);
        }
      } catch (e) {
        setStatus('Gagal mengonversi video.', true);
      }
    }

    async function convertPlaylist() {
      const url = document.getElementById('playlistUrl').value;
      if (!url) return alert('Masukkan URL Playlist!');
      setStatus('Mengimpor seluruh playlist YouTube...');
      const baseUrl = getBackendUrl();
      try {
        const res = await fetch(`${baseUrl}/api/convert-playlist`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playlistUrl: url })
        });
        const data = await res.json();
        if (res.ok) {
          setStatus(`Berhasil mengimpor ${data.totalAdded || 0} lagu!`);
          document.getElementById('playlistUrl').value = '';
          loadLibrary();
        } else {
          setStatus('Gagal mengimpor playlist.', true);
        }
      } catch (e) {
        setStatus('Gagal mengimpor playlist.', true);
      }
    }

    function playSong(url, title, artist, cover) {
      const player = document.getElementById('audioPlayer');
      document.getElementById('nowPlaying').innerText = `PLAYING: ${title} - ${artist}`;
      player.src = url;
      player.play().catch(console.warn);
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title, artist, artwork: [{ src: cover, sizes: '512x512', type: 'image/jpeg' }]
        });
      }
    }

    loadLibrary();
  </script>
</body>
    </html>
