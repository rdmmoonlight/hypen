name: Deploy Application

on:
  workflow_run:
    workflows: ["Code Quality Check & Auto-Fix"]
    types:
      - completed
    branches:
      - main

# Memaksa deploy juga antre berurutan
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server
    # Hanya jalan jika workflow linting SELESAI dengan SUKSES
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v4
        with:
          ref: main # Selalu ambil commit paling akhir setelah auto-fix

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build & Publish Application
        run: dotnet publish -c Release -o ./publish

      # - name: Deploy Step (SSH / Docker / Cloud)
      #   run: ...
