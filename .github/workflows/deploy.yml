name: Deploy Application

on:
  workflow_run:
    workflows: ["Code Quality Check & Auto-Fix"]
    types:
      - completed
    branches:
      - main
  push:
    branches: [ "main" ]

# Memaksa deploy antre berurutan
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Izin yang dibutuhkan untuk deploy ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy to Server & Pages
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v4
        with:
          ref: main

      # Inject Environment Variable BACKEND_URL ke config.js
      - name: Inject Dynamic Config File
        run: |
          echo "window.ENV_BACKEND_URL = '${{ vars.BACKEND_URL }}';" > config.js
          if [ -d "web" ]; then
            echo "window.ENV_BACKEND_URL = '${{ vars.BACKEND_URL }}';" > web/config.js
          fi

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore & Publish .NET langsung mengarah ke apps/backend/Hypen.csproj
      - name: Build & Publish Backend Application
        run: |
          dotnet restore apps/backend/Hypen.csproj
          dotnet publish apps/backend/Hypen.csproj -c Release -o ./publish /p:UseAppHost=false

      # ========================================================
      # GitHub Pages Deployment Steps
      # ========================================================
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Mengunggah direktori utama (index.html, theme.css, config.js)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
