name: Deploy Application

on:
  workflow_run:
    workflows: ["Code Quality Check & Auto-Fix"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Server
    # Hanya jalan jika workflow linting selesai dengan SUKSES
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v4
        with:
          ref: main # Memastikan mengambil commit terbaru setelah auto-fix

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Tambahkan step build / publish / deploy Anda di sini
      - name: Build & Publish Application
        run: dotnet publish -c Release -o ./publish

      # - name: Deploy Step (e.g., SSH / Docker / Cloud)
      #   run: ...
