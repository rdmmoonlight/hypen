name: Deploy Application (Blazor WASM)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Publish Blazor WebAssembly App ke folder _site
      - name: Publish Blazor WebAssembly
        run: |
          dotnet publish apps/web/Hypen.Web.csproj -c Release -o _site/wwwroot
          
          # Trik wajib GitHub Pages untuk Blazor WASM (Single Page Application Fallback)
          cp _site/wwwroot/index.html _site/wwwroot/404.html
          touch _site/wwwroot/.nojekyll

      - name: Upload Artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site/wwwroot'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
