name: Deploy Application (Blazor WASM)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WebAssembly
        run: |
          # 1. Bersihkan direktori output lama
          rm -rf _site

          # 2. Publish Blazor WASM ke folder _site/wwwroot
          dotnet publish apps/web/Hypen.Web.csproj -c Release -o _site/wwwroot

          # 3. Trik SPA Fallback untuk GitHub Pages (Salin index.html ke 404.html)
          if [ -f "_site/wwwroot/wwwroot/index.html" ]; then
            cp _site/wwwroot/wwwroot/index.html _site/wwwroot/index.html
            cp _site/wwwroot/wwwroot/index.html _site/wwwroot/404.html
          elif [ -f "_site/wwwroot/index.html" ]; then
            cp _site/wwwroot/index.html _site/wwwroot/404.html
          fi

          # 4. Buat file .nojekyll agar GitHub Pages tidak memblokir folder _framework
          touch _site/wwwroot/.nojekyll

      - name: Upload Artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site/wwwroot'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
