name: Deploy Application

on:
  workflow_run:
    workflows: ["Code Quality Check & Auto-Fix"]
    types:
      - completed
    branches:
      - main

# Memaksa deploy antre berurutan
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Izin yang dibutuhkan untuk deploy ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy to Server & Pages
    # Hanya jalan jika workflow linting SELESAI dengan SUKSES
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Latest Code
        uses: actions/checkout@v4
        with:
          ref: main # Selalu ambil commit paling akhir setelah auto-fix

      # Inject Environment Variable BACKEND_URL ke config.js untuk Frontend HTML/JS
      - name: Inject Dynamic Config File
        run: |
          echo "window.ENV_BACKEND_URL = '${{ vars.BACKEND_URL }}';" > config.js
          if [ -d "web" ]; then
            echo "window.ENV_BACKEND_URL = '${{ vars.BACKEND_URL }}';" > web/config.js
          fi

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Build & Publish .NET (Otomatis mencari file .csproj)
      - name: Build & Publish Application
        run: |
          PROJ_FILE=$(find . -maxdepth 3 -name "*.csproj" | head -n 1)
          if [ -n "$PROJ_FILE" ]; then
            echo "Building project: $PROJ_FILE"
            dotnet restore "$PROJ_FILE"
            dotnet publish "$PROJ_FILE" -c Release -o ./publish /p:UseAppHost=false
          else
            echo "No .csproj file found, skipping .NET publish."
          fi

      # ========================================================
      # GitHub Pages Deployment Steps
      # ========================================================
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Mengunggah direktori utama (index.html, theme.css, config.js)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
