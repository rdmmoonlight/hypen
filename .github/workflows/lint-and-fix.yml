name: Auto Lint, Fix & Commit C# Code

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-fix:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository dengan token izin write
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    # 2. Setup .NET 10 SDK
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. Restore dependencies
    - name: Restore Dependencies
      run: dotnet restore

    # 4. Jalankan dotnet format untuk auto-fix style & linting
    - name: Run Dotnet Format Fix
      run: dotnet format --severity info

    # 5. Commit dan Push kembali ke GitHub jika ada file yang di-fix otomatis
    - name: Commit & Push Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "style(ci): auto-fix code style and linting [skip ci]"
        branch: main
        commit_user_name: "github-actions[bot]"
        commit_user_email: "github-actions[bot]@users.noreply.github.com"
