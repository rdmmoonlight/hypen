name: Code Quality Check & Auto-Fix

on:
  push:
    branches: [ "main" ]

# Memaksa workflow ini masuk antrean (queue) dan TIDAK berjalan bersamaan
concurrency:
  group: lint-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-fix:
    name: C# Format & Security Check
    # Stop jika push berasal dari bot auto-fix itu sendiri (mencegah loop)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Restore spesifik per file project C#
      - name: Restore Dependencies
        run: |
          if [ -f "apps/backend/Hypen.csproj" ]; then
            dotnet restore apps/backend/Hypen.csproj
          fi
          if [ -f "apps/mobile/HypenMaui.csproj" ]; then
            dotnet restore apps/mobile/HypenMaui.csproj
          fi

      # Format spesifik per file project C#
      - name: Run Dotnet Format Fix
        run: |
          if [ -f "apps/backend/Hypen.csproj" ]; then
            dotnet format apps/backend/Hypen.csproj --severity info
          fi
          if [ -f "apps/mobile/HypenMaui.csproj" ]; then
            dotnet format apps/mobile/HypenMaui.csproj --severity info
          fi

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(ci): auto-fix code style and linting [skip ci]"
          branch: main
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
