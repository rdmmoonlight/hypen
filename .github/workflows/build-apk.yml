name: Build Android APK (.NET MAUI)

on:
  push:
    branches: [ "main" ]

jobs:
  build-maui-apk:
    name: Build .NET MAUI Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Install Workload .NET MAUI Android
      - name: Install .NET MAUI Workload
        run: dotnet workload install maui-android

      # Restore & Build APK dengan menentukan path file .csproj secara spesifik
      - name: Build MAUI Android App
        run: |
          dotnet restore apps/mobile/HypenMaui.csproj
          dotnet build apps/mobile/HypenMaui.csproj -c Release -f net10.0-android --no-restore

      # Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hypen-Vault-MAUI-APK
          path: apps/mobile/bin/Release/net10.0-android/*-Signed.apk
