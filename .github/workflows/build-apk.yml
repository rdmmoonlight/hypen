name: Build Android APK (.NET MAUI)

on:
  push:
    branches: [ "production" ]

jobs:
  build-maui-apk:
    name: Build .NET MAUI Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Install Workload .NET MAUI Android
      - name: Install .NET MAUI Workload
        run: dotnet workload install maui-android

      # Inisialisasi Resources & Platforms jika belum ada (tanpa menimpa file eksisting)
      - name: Ensure Android Resources & Configuration
        run: |
          echo "Checking and preparing MAUI Android resources..."

          # 1. Pastikan struktur folder dasar terbuat
          mkdir -p apps/mobile/Resources/AppIcon
          mkdir -p apps/mobile/Resources/Splash
          mkdir -p apps/mobile/Resources/Fonts
          mkdir -p apps/mobile/Resources/Images
          mkdir -p apps/mobile/Platforms/Android

          # 2. Cek dan buat AppIcon default jika belum ada
          if [ ! -f "apps/mobile/Resources/AppIcon/appicon.svg" ]; then
            echo "appicon.svg missing. Generating placeholder icon..."
            cat <<'EOF' > apps/mobile/Resources/AppIcon/appicon.svg
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
              <rect width="100" height="100" rx="20" fill="#512BD4"/>
              <text x="50" y="55" font-size="32" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">H</text>
            </svg>
          EOF
          else
            echo "appicon.svg already exists. Skipping..."
          fi

          # 3. Cek dan buat Splash Screen default jika belum ada
          if [ ! -f "apps/mobile/Resources/Splash/splash.svg" ]; then
            echo "splash.svg missing. Copying placeholder..."
            cp apps/mobile/Resources/AppIcon/appicon.svg apps/mobile/Resources/Splash/splash.svg
          else
            echo "splash.svg already exists. Skipping..."
          fi

          # 4. Cek dan buat MainActivity.cs jika belum ada (memastikan MainLauncher = true)
          if [ ! -f "apps/mobile/Platforms/Android/MainActivity.cs" ]; then
            echo "MainActivity.cs missing. Generating base MainActivity..."
            cat <<'EOF' > apps/mobile/Platforms/Android/MainActivity.cs
          using Android.App;
          using Android.Content.PM;
          using Microsoft.Maui;

          namespace HypenMaui;

          [Activity(
              Theme = "@style/Maui.SplashTheme",
              MainLauncher = true,
              LaunchMode = LaunchMode.SingleTop,
              ConfigurationChanges = ConfigChanges.ScreenSize | ConfigChanges.Orientation | ConfigChanges.UiMode | ConfigChanges.ScreenLayoutClass | ConfigChanges.SmallestScreenSize | ConfigChanges.Density)]
          public class MainActivity : MauiAppCompatActivity
          {
          }
          EOF
          else
            echo "MainActivity.cs already exists. Skipping..."
          fi

      # Restore & Build APK dengan menentukan path file .csproj secara spesifik
      - name: Build MAUI Android App
        run: |
          dotnet restore apps/mobile/HypenMaui.csproj
          dotnet build apps/mobile/HypenMaui.csproj -c Release -f net10.0-android --no-restore

      # Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hypen-Vault-MAUI-APK
          path: apps/mobile/bin/Release/net10.0-android/*-Signed.apk
          
