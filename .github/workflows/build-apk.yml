name: Build Android APK (.NET MAUI)

on:
  push:
    branches: [ "production" ]

permissions:
  contents: write

jobs:
  build-maui-apk:
    name: Build & Release .NET MAUI Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. GENERATE DYNAMIC VERSIONING (vYY.MM.BUILD)
      - name: Generate Dynamic Version Number
        id: versioning
        run: |
          YEAR=$(date +'%y')
          MONTH=$(date +'%m')
          BUILD_NUM=${{ github.run_number }}
          
          VERSION_NAME="${YEAR}.${MONTH}.${BUILD_NUM}"
          TAG_NAME="v${VERSION_NAME}"
          
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "Generated Version: ${TAG_NAME}"

      # 2. SETUP ENVIRONMENT & DEPENDENCIES
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui-android

      # 3. RESTORE & BUILD WITH SECRETS INJECTION (LAST.FM & GOOGLE DRIVE)
      - name: Build MAUI Android App
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          dotnet restore apps/mobile/HypenMaui.csproj
          dotnet build apps/mobile/HypenMaui.csproj -c Release -f net9.0-android --no-restore \
            -p:ApplicationDisplayVersion="${{ env.VERSION_NAME }}" \
            -p:ApplicationVersion="${{ github.run_number }}" \
            -p:LastFmApiKey="${LASTFM_API_KEY}" \
            -p:LastFmApiSecret="${LASTFM_API_SECRET}" \
            -p:GoogleClientId="${GOOGLE_CLIENT_ID}" \
            -p:GoogleClientSecret="${GOOGLE_CLIENT_SECRET}"

      # 4. POST-BUILD STANDARDIZATION & VALIDATION CHECK
      - name: Validate & Prepare APK Artifact
        run: |
          mkdir -p release-assets
          
          # Cari file APK hasil build (Perbaikan typo /dev/null di baris ini)
          APK_FILE=$(ls apps/mobile/bin/Release/net9.0-android/*-Signed.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(ls apps/mobile/bin/Release/net9.0-android/*.apk 2>/devnull | head -n 1)
          fi

          # Validasi keberadaan file APK
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: File APK tidak ditemukan di folder output!"
            exit 1
          fi

          # Validasi ukuran file (minimal 10 MB = 10485760 bytes)
          FILE_SIZE=$(stat -c%s "$APK_FILE")
          echo "APK Found: $APK_FILE ($FILE_SIZE bytes)"
          if [ $FILE_SIZE -lt 10485760 ]; then
            echo "ERROR: Ukuran APK terlalu kecil ($FILE_SIZE bytes), kemungkinan build corrupt!"
            exit 1
          fi

          # Copy dan rename APK ke folder release-assets
          cp "$APK_FILE" "release-assets/HypenVault-${{ env.TAG_NAME }}.apk"
          echo "Sanity Check OK. APK siap dirilis: release-assets/HypenVault-${{ env.TAG_NAME }}.apk"

      # 5. ARTIFACT UPLOAD
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hypen-Vault-MAUI-APK
          path: release-assets/*.apk

      # 6. AUTOMATED GITHUB RELEASE
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Hypen Vault ${{ env.TAG_NAME }}
          body: |
            Automated Release for Hypen Vault Android.
            Version: ${{ env.TAG_NAME }}
            Build Number: ${{ github.run_number }}
            
            Features:
            - Offline Local Music Vault Player
            - Personal Cloud Vault (Google Drive & TeraBox Integration)
            - Integrated Last.fm Scrobbler
            - AppShell Navigation Bar System
            - Automatic In-App Updating
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
