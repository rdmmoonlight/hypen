name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Setup Project Mobile & Capacitor dalam 1 folder kerja
      - name: Setup Capacitor Project & Assets
        run: |
          mkdir -p apps/mobile/www
          
          # Salin file frontend web (Cek file di root/web)
          if [ -d "web" ]; then
            cp web/* apps/mobile/www/
          else
            cp index.html theme.css config.js apps/mobile/www/ 2>/dev/null || true
          fi
          
          cd apps/mobile
          
          # Inisialisasi package.json
          npm init -y
          
          # Install Capacitor CLI & Core
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Inisialisasi Project Capacitor
          npx cap init "Hypen Vault" "com.hypen.vault" --web-dir "www"
          
          # Tambahkan Platform Android
          npx cap add android

      # Inject Izin Jaringan & Media ke AndroidManifest.xml
      - name: Configure Android Permissions
        run: |
          MANIFEST="apps/mobile/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />' $MANIFEST
          fi

      # Sync Aset Web & Build APK Debug
      - name: Build APK with Gradle
        run: |
          cd apps/mobile
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Unggah File APK ke Tab Actions GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hypen-Vault-App
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
