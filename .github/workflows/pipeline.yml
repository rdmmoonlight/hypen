name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------
  # STEP 1: Linting, Formatting, & Auto-Fix (Wajib Jalan)
  # ----------------------------------------------------
  lint-and-fix:
    name: Code Formatting & Quality Check
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      mobile_changed: ${{ steps.changes.outputs.mobile }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Deteksi perubahan khusus folder apps/mobile/
      - name: Detect Mobile Changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Web & Backend Dependencies
        run: |
          if [ -f "apps/backend/Hypen.csproj" ]; then dotnet restore apps/backend/Hypen.csproj; fi
          if [ -f "apps/web/Hypen.Web.csproj" ]; then dotnet restore apps/web/Hypen.Web.csproj; fi

      - name: Run Dotnet Format Fix
        continue-on-error: true
        run: |
          if [ -f "apps/backend/Hypen.csproj" ]; then 
            dotnet format whitespace apps/backend/Hypen.csproj --no-restore
            dotnet format style apps/backend/Hypen.csproj --no-restore --severity info
          fi
          if [ -f "apps/web/Hypen.Web.csproj" ]; then 
            dotnet format whitespace apps/web/Hypen.Web.csproj --no-restore
            dotnet format style apps/web/Hypen.Web.csproj --no-restore --severity info
          fi

      - name: Revert Generated Files
        run: |
          git checkout -- **/obj/** **/bin/** 2>/dev/null || true

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(ci): auto-fix code style and linting [skip ci]"
          branch: main
          file_pattern: 'apps/**/*.cs apps/**/*.razor'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          internal_git_options: '-c rebase.autoStash=true'

  # ----------------------------------------------------
  # CABANG 1: Build Blazor WASM
  # ----------------------------------------------------
  build-web:
    name: Build Blazor WebAssembly
    needs: lint-and-fix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WebAssembly
        run: |
          rm -rf _site
          dotnet publish apps/web/Hypen.Web.csproj -c Release -o _site/wwwroot

          if [ -f "_site/wwwroot/wwwroot/index.html" ]; then
            cp _site/wwwroot/wwwroot/index.html _site/wwwroot/index.html
            cp _site/wwwroot/wwwroot/index.html _site/wwwroot/404.html
          elif [ -f "_site/wwwroot/index.html" ]; then
            cp _site/wwwroot/index.html _site/wwwroot/404.html
          fi

          touch _site/wwwroot/.nojekyll

      - name: Upload Artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site/wwwroot'

  # ----------------------------------------------------
  # CABANG 2: Build & Release MAUI Android APK (UTUH FULL)
  # (Hanya dipicu setelah linting sukses DAN ada perubahan di apps/mobile/)
  # ----------------------------------------------------
  build-maui-apk:
    name: Build & Release .NET MAUI Android APK
    needs: lint-and-fix
    if: needs.lint-and-fix.outputs.mobile_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. GENERATE DYNAMIC VERSIONING (vYY.MM.BUILD)
      - name: Generate Dynamic Version Number
        id: versioning
        run: |
          YEAR=$(date +'%y')
          MONTH=$(date +'%m')
          BUILD_NUM=${{ github.run_number }}
          
          VERSION_NAME="${YEAR}.${MONTH}.${BUILD_NUM}"
          TAG_NAME="v${VERSION_NAME}"
          
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "Generated Version: ${TAG_NAME}"

      # 2. SETUP ENVIRONMENT & DEPENDENCIES
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui-android

      # 3. RESTORE & BUILD WITH SECRETS INJECTION
      - name: Build MAUI Android App
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          # Restore dengan spesifikasi TargetFramework agar project.assets.json valid
          dotnet restore apps/mobile/HypenMaui.csproj -f net10.0-android
          
          dotnet build apps/mobile/HypenMaui.csproj -c Release -f net10.0-android --no-restore \
            -p:ApplicationDisplayVersion="${{ env.VERSION_NAME }}" \
            -p:ApplicationVersion="${{ github.run_number }}" \
            -p:LastFmApiKey="${LASTFM_API_KEY}" \
            -p:LastFmApiSecret="${LASTFM_API_SECRET}" \
            -p:GoogleClientId="${GOOGLE_CLIENT_ID}" \
            -p:GoogleClientSecret="${GOOGLE_CLIENT_SECRET}"

      # 4. POST-BUILD STANDARDIZATION & VALIDATION CHECK
      - name: Validate & Prepare APK Artifact
        run: |
          mkdir -p release-assets
          
          # Cari file APK hasil build di folder net10.0-android
          APK_FILE=$(ls apps/mobile/bin/Release/net10.0-android/*-Signed.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(ls apps/mobile/bin/Release/net10.0-android/*.apk 2>/dev/null | head -n 1)
          fi

          # Validasi keberadaan file APK
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: File APK tidak ditemukan di folder output!"
            exit 1
          fi

          # Validasi ukuran file (minimal 10 MB = 10485760 bytes)
          FILE_SIZE=$(stat -c%s "$APK_FILE")
          echo "APK Found: $APK_FILE ($FILE_SIZE bytes)"
          if [ $FILE_SIZE -lt 10485760 ]; then
            echo "ERROR: Ukuran APK terlalu kecil ($FILE_SIZE bytes), kemungkinan build corrupt!"
            exit 1
          fi

          # Copy dan rename APK ke folder release-assets
          cp "$APK_FILE" "release-assets/HypenVault-${{ env.TAG_NAME }}.apk"
          echo "Sanity Check OK. APK siap dirilis: release-assets/HypenVault-${{ env.TAG_NAME }}.apk"

      # 5. ARTIFACT UPLOAD
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hypen-Vault-MAUI-APK
          path: release-assets/*.apk

      # 6. AUTOMATED GITHUB RELEASE
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Hypen Vault ${{ env.TAG_NAME }}
          body: |
            Automated Release for Hypen Vault Android.
            Version: ${{ env.TAG_NAME }}
            Build Number: ${{ github.run_number }}
            
            Features:
            - Offline Local Music Vault Player
            - Personal Cloud Vault (Google Drive & TeraBox Integration)
            - Integrated Last.fm Scrobbler
            - AppShell Navigation Bar System
            - Automatic In-App Updating
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------
  # STEP AKHIR: Deploy Blazor WASM ke GitHub Pages
  # ----------------------------------------------------
  deploy:
    name: Deploy Web to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
