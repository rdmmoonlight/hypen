name: Code Quality Check & Deploy

on:
  push:
    branches: [ main ]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------
  # STEP 1: Linting, Formatting, & Auto-Fix (Root)
  # ----------------------------------------------------
  lint-and-fix:
    name: C# Format & Quality Check
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Clean & Restore Dependencies
        run: |
          if [ -f "apps/backend/Hypen.csproj" ]; then 
            dotnet clean apps/backend/Hypen.csproj
            dotnet restore apps/backend/Hypen.csproj
          fi
          if [ -f "apps/web/Hypen.Web.csproj" ]; then 
            dotnet clean apps/web/Hypen.Web.csproj
            dotnet restore apps/web/Hypen.Web.csproj
          fi

      - name: Run Dotnet Format Fix
        continue-on-error: true
        run: |
          if [ -f "apps/backend/Hypen.csproj" ]; then 
            dotnet format whitespace apps/backend/Hypen.csproj --no-restore
            dotnet format style apps/backend/Hypen.csproj --no-restore --severity info
          fi
          if [ -f "apps/web/Hypen.Web.csproj" ]; then 
            dotnet format whitespace apps/web/Hypen.Web.csproj --no-restore
            dotnet format style apps/web/Hypen.Web.csproj --no-restore --severity info
          fi

      - name: Revert Generated Files
        run: |
          git checkout -- **/obj/** **/bin/** 2>/dev/null || true

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style(ci): auto-fix code style and linting [skip ci]"
          branch: main
          file_pattern: 'apps/**/*.cs apps/**/*.razor'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          internal_git_options: '-c rebase.autoStash=true'

  # ----------------------------------------------------
  # CABANG 1: Build & Publish Blazor WASM
  # ----------------------------------------------------
  build-web:
    name: Build Blazor WASM
    needs: lint-and-fix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WebAssembly
        run: |
          # Bersihkan cache build lama untuk mencegah duplikasi StaticWebAssets Manifest
          dotnet clean apps/web/Hypen.Web.csproj
          rm -rf publish_output
          
          # Publish ulang ke folder output
          dotnet publish apps/web/Hypen.Web.csproj -c Release -o publish_output
          
          # Membuat file .nojekyll agar folder _framework tidak diabaikan oleh GitHub Pages
          touch publish_output/wwwroot/.nojekyll
          
          # Duplikasi index.html ke 404.html untuk menangani Blazor WASM client-side routing
          if [ -f "publish_output/wwwroot/index.html" ]; then
            cp publish_output/wwwroot/index.html publish_output/wwwroot/404.html
          fi

      - name: Upload Artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'publish_output/wwwroot'

  # ----------------------------------------------------
  # CABANG 2: Build & Verify Backend (Paralel)
  # ----------------------------------------------------
  build-backend:
    name: Verify Backend Build
    needs: lint-and-fix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Backend App
        run: |
          if [ -f "apps/backend/Hypen.csproj" ]; then 
            dotnet clean apps/backend/Hypen.csproj
            dotnet build apps/backend/Hypen.csproj -c Release
          fi

  # ----------------------------------------------------
  # STEP AKHIR: Deploy ke GitHub Pages
  # ----------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
