name: Hypen Android CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/**'

concurrency:
  group: android-ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ====================================================
  # KOTAK 1: PREPARE VERSION
  # ====================================================
  prepare-version:
    name: 1. Prepare Version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.versioning.outputs.version_name }}
      tag_name: ${{ steps.versioning.outputs.tag_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Dynamic Version Number
        id: versioning
        run: |
          YEAR=$(date +'%y')
          MONTH=$(date +'%m')
          BUILD_NUM=${{ github.run_number }}
          
          VERSION_NAME="${YEAR}.${MONTH}.${BUILD_NUM}"
          TAG_NAME="v${VERSION_NAME}"
          
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

  # ====================================================
  # KOTAK 2A: BUILD MAUI APK (Tugas Berat)
  # ====================================================
  build-apk:
    name: 2a. Build MAUI APK
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui-android

      - name: Restore & Build MAUI Android App
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          dotnet restore apps/mobile/HypenMaui.csproj -p:TargetFramework=net10.0-android
          
          dotnet build apps/mobile/HypenMaui.csproj -c Release -f net10.0-android --no-restore \
            -p:ApplicationDisplayVersion="${{ needs.prepare-version.outputs.version_name }}" \
            -p:ApplicationVersion="${{ github.run_number }}" \
            -p:LastFmApiKey="${LASTFM_API_KEY:-dummy_key}" \
            -p:LastFmApiSecret="${LASTFM_API_SECRET:-dummy_secret}" \
            -p:GoogleClientId="${GOOGLE_CLIENT_ID:-dummy_client_id}" \
            -p:GoogleClientSecret="${GOOGLE_CLIENT_SECRET:-dummy_client_secret}"

      - name: Upload Raw APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-maui-apk
          path: apps/mobile/bin/Release/net10.0-android/*.apk
          retention-days: 1

  # ====================================================
  # KOTAK 2B: PREPARE RELEASE NOTES (Jalan Paralel dengan Build)
  # ====================================================
  prepare-release-notes:
    name: 2b. Generate Release Notes
    needs: prepare-version
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.notes.outputs.body }}
    steps:
      - name: Draft Release Changelog
        id: notes
        run: |
          BODY=$(cat << 'EOF'
          Automated Release for Hypen Vault Android.
          
          Features & Highlights:
          - Offline Local Music Vault Player
          - Personal Cloud Vault (Google Drive & TeraBox Integration)
          - Integrated Last.fm Scrobbler
          - AppShell Navigation Bar System
          - Automatic In-App Updating
          EOF
          )
          echo "body=$BODY" >> $GITHUB_OUTPUT

  # ====================================================
  # KOTAK 3: VALIDATE & SANITY CHECK APK
  # ====================================================
  validate-apk:
    name: 3. Validate & Sanity Check APK
    needs: [prepare-version, build-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Download Raw APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: raw-maui-apk
          path: build-output

      - name: Validate File Integrity & Size
        run: |
          mkdir -p release-assets
          
          APK_FILE=$(ls build-output/*-Signed.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(ls build-output/*.apk 2>/dev/null | head -n 1)
          fi

          if [ -z "$APK_FILE" ]; then
            echo "::error::File APK tidak ditemukan!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_FILE")
          echo "APK Found: $APK_FILE ($FILE_SIZE bytes)"
          
          if [ $FILE_SIZE -lt 10485760 ]; then
            echo "::error::Ukuran APK terlalu kecil ($FILE_SIZE bytes)!"
            exit 1
          fi

          cp "$APK_FILE" "release-assets/HypenVault-${{ needs.prepare-version.outputs.tag_name }}.apk"

      - name: Upload Validated Final Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hypen-Vault-MAUI-APK
          path: release-assets/*.apk

  # ====================================================
  # KOTAK 4: PUBLISH TO GITHUB RELEASES
  # ====================================================
  publish-release:
    name: 4. Publish to GitHub Releases
    needs: [prepare-version, validate-apk, prepare-release-notes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Validated APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Hypen-Vault-MAUI-APK
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag_name }}
          name: Hypen Vault ${{ needs.prepare-version.outputs.tag_name }}
          body: |
            Version: ${{ needs.prepare-version.outputs.tag_name }}
            Build Number: ${{ github.run_number }}
            
            ${{ needs.prepare-release-notes.outputs.release_body }}
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
