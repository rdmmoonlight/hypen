name: Hypen Android CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/**'

concurrency:
  group: android-ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ====================================================
  # CABANG UTAMA (ROOT): VERSION GENERATOR
  # ====================================================
  prepare-version:
    name: 1. Generate App Version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.versioning.outputs.version_name }}
      tag_name: ${{ steps.versioning.outputs.tag_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Version (vYY.MM.BUILD)
        id: versioning
        run: |
          YEAR=$(date +'%y')
          MONTH=$(date +'%m')
          BUILD_NUM=${{ github.run_number }}
          
          VERSION_NAME="${YEAR}.${MONTH}.${BUILD_NUM}"
          TAG_NAME="v${VERSION_NAME}"
          
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

  # ====================================================
  # CABANG PARALEL A: BUILD & VALIDATE APK
  # ====================================================
  build-and-validate-apk:
    name: 2a. Build & Validate APK
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui-android

      - name: Clean Build Artifacts
        run: |
          dotnet clean apps/mobile/HypenMaui.csproj -c Release -f net10.0-android --verbosity minimal || true
          rm -rf apps/mobile/bin/Release/net10.0-android
          rm -rf apps/mobile/obj/Release/net10.0-android

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diset. APK tidak akan tertanda dengan key tetap, update akan gagal (App not installed)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/hypen-release.keystore

      - name: Compile & Publish Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet restore apps/mobile/HypenMaui.csproj -p:TargetFramework=net10.0-android
          
          dotnet publish apps/mobile/HypenMaui.csproj -c Release -f net10.0-android --no-restore \
            -p:ApplicationDisplayVersion="${{ needs.prepare-version.outputs.version_name }}" \
            -p:ApplicationVersion="${{ github.run_number }}" \
            -p:LASTFM_KEY="${LASTFM_API_KEY:-dummy_key}" \
            -p:LASTFM_SECRET="${LASTFM_API_SECRET:-dummy_secret}" \
            -p:GoogleClientId="${GOOGLE_CLIENT_ID:-dummy_client_id}" \
            -p:GoogleClientSecret="${GOOGLE_CLIENT_SECRET:-dummy_client_secret}" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$(pwd)/apps/mobile/hypen-release.keystore" \
            -p:AndroidSigningKeyAlias="${ANDROID_KEY_ALIAS}" \
            -p:AndroidSigningStorePass="${ANDROID_KEYSTORE_PASSWORD}" \
            -p:AndroidSigningKeyPass="${ANDROID_KEY_PASSWORD}"

      - name: Clean Up Keystore File
        if: always()
        run: |
          if [ -f "apps/mobile/hypen-release.keystore" ]; then
            rm -f apps/mobile/hypen-release.keystore
          fi

      - name: Validate APK & Prepare Final Release Asset
        run: |
          mkdir -p release-assets
          
          # Cari APK di seluruh direktori output build/publish
          APK_FILE=$(find apps/mobile/bin/Release/net10.0-android -type f -name "*-Signed.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find apps/mobile/bin/Release/net10.0-android -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APK_FILE" ]; then
            echo "::error::File APK tidak ditemukan!"
            echo "--- Struktur folder output build ---"
            ls -R apps/mobile/bin/Release/net10.0-android/ || true
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_FILE")
          echo "APK Found: $APK_FILE ($FILE_SIZE bytes)"
          
          if [ $FILE_SIZE -lt 10485760 ]; then
            echo "::error::Ukuran APK terlalu kecil ($FILE_SIZE bytes)!"
            exit 1
          fi

          cp "$APK_FILE" "release-assets/HypenVault-${{ needs.prepare-version.outputs.tag_name }}.apk"

      - name: Upload Single Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hypen-Vault-MAUI-APK
          path: release-assets/*.apk

  # ====================================================
  # CABANG PARALEL B: GENERATE CHANGELOG
  # ====================================================
  generate-release-notes:
    name: 2b. Generate Changelog & Notes
    needs: prepare-version
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.notes.outputs.body }}
    steps:
      - name: Draft Release Notes
        id: notes
        run: |
          {
            echo "body<<EOF"
            echo "### 🚀 Release Highlights"
            echo "- Offline Local Music Vault Player"
            echo "- Personal Cloud Vault (Google Drive & TeraBox Integration)"
            echo "- Integrated Last.fm Scrobbler"
            echo "- AppShell Navigation Bar System"
            echo "- Automatic In-App Updating"
            echo "EOF"
          } >> $GITHUB_OUTPUT

  # ====================================================
  # CABANG PARALEL C: BUILD METADATA
  # ====================================================
  generate-build-summary:
    name: 2c. Prepare Build Metadata
    needs: prepare-version
    runs-on: ubuntu-latest
    outputs:
      build_meta: ${{ steps.meta.outputs.meta }}
    steps:
      - name: Create Metadata String
        id: meta
        run: |
          META_TEXT="Build ID: ${{ github.run_number }} | Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}"
          echo "meta=${META_TEXT}" >> $GITHUB_OUTPUT

  # ====================================================
  # KOTAK AKHIR (PUBLISH RELEASE)
  # ====================================================
  publish-github-release:
    name: 3. Publish to GitHub Releases
    needs: [prepare-version, build-and-validate-apk, generate-release-notes, generate-build-summary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Final APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Hypen-Vault-MAUI-APK
          path: release-assets

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag_name }}
          name: Hypen Vault ${{ needs.prepare-version.outputs.tag_name }}
          body: |
            **Version:** ${{ needs.prepare-version.outputs.tag_name }}
            **Metadata:** ${{ needs.generate-build-summary.outputs.build_meta }}

            ${{ needs.generate-release-notes.outputs.release_body }}
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
