name: Android CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/**'

concurrency:
  group: android-ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-maui-apk:
    name: Build & Release .NET MAUI Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ----------------------------------------------------
      # STEP 1: CODE CHECKOUT
      # ----------------------------------------------------
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------
      # STEP 2: VERSIONING GENERATION
      # ----------------------------------------------------
      - name: 2. Generate Dynamic Version Number (vYY.MM.BUILD)
        id: versioning
        run: |
          YEAR=$(date +'%y')
          MONTH=$(date +'%m')
          BUILD_NUM=${{ github.run_number }}
          
          VERSION_NAME="${YEAR}.${MONTH}.${BUILD_NUM}"
          TAG_NAME="v${VERSION_NAME}"
          
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          
          echo "=========================================="
          echo " Generated Version Name : ${VERSION_NAME}"
          echo " Generated Tag Name     : ${TAG_NAME}"
          echo "=========================================="

      # ----------------------------------------------------
      # STEP 3: ENVIRONMENT PREPARATION
      # ----------------------------------------------------
      - name: 3a. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: 3b. Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3c. Install .NET MAUI Workload
        run: dotnet workload install maui-android

      # ----------------------------------------------------
      # STEP 4: RESTORE & BUILD APK
      # ----------------------------------------------------
      - name: 4a. Restore Project Dependencies
        run: dotnet restore apps/mobile/HypenMaui.csproj -p:TargetFramework=net10.0-android

      - name: 4b. Compile & Build MAUI Android Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          dotnet build apps/mobile/HypenMaui.csproj -c Release -f net10.0-android --no-restore \
            -p:ApplicationDisplayVersion="${{ env.VERSION_NAME }}" \
            -p:ApplicationVersion="${{ github.run_number }}" \
            -p:LastFmApiKey="${LASTFM_API_KEY:-dummy_key}" \
            -p:LastFmApiSecret="${LASTFM_API_SECRET:-dummy_secret}" \
            -p:GoogleClientId="${GOOGLE_CLIENT_ID:-dummy_client_id}" \
            -p:GoogleClientSecret="${GOOGLE_CLIENT_SECRET:-dummy_client_secret}"

      # ----------------------------------------------------
      # STEP 5: APK VALIDATION & PREPARATION
      # ----------------------------------------------------
      - name: 5. Validate Integrity & Prepare APK Release File
        run: |
          mkdir -p release-assets
          
          # Cari file APK hasil build di folder output
          APK_FILE=$(ls apps/mobile/bin/Release/net10.0-android/*-Signed.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(ls apps/mobile/bin/Release/net10.0-android/*.apk 2>/dev/null | head -n 1)
          fi

          # Validasi keberadaan file
          if [ -z "$APK_FILE" ]; then
            echo "::error::File APK tidak ditemukan di folder output!"
            exit 1
          fi

          # Validasi ukuran file (minimal 10 MB = 10485760 bytes)
          FILE_SIZE=$(stat -c%s "$APK_FILE")
          echo "APK Located: $APK_FILE ($FILE_SIZE bytes)"
          if [ $FILE_SIZE -lt 10485760 ]; then
            echo "::error::Ukuran APK terlalu kecil ($FILE_SIZE bytes), kemungkinan build corrupt!"
            exit 1
          fi

          # Copy & Rename
          cp "$APK_FILE" "release-assets/HypenVault-${{ env.TAG_NAME }}.apk"
          echo "=========================================="
          echo " Sanity Check Status : PASSED"
          echo " Release Asset Path  : release-assets/HypenVault-${{ env.TAG_NAME }}.apk"
          echo "=========================================="

      # ----------------------------------------------------
      # STEP 6: ARTIFACT UPLOAD & PUBLISH RELEASE
      # ----------------------------------------------------
      - name: 6a. Upload Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Hypen-Vault-MAUI-APK
          path: release-assets/*.apk

      - name: 6b. Create Automated GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Hypen Vault ${{ env.TAG_NAME }}
          body: |
            Automated Release for Hypen Vault Android.
            Version: ${{ env.TAG_NAME }}
            Build Number: ${{ github.run_number }}
            
            Features:
            - Offline Local Music Vault Player
            - Personal Cloud Vault (Google Drive & TeraBox Integration)
            - Integrated Last.fm Scrobbler
            - AppShell Navigation Bar System
            - Automatic In-App Updating
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
