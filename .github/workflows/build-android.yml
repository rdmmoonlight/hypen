name: Hypen Android CI/CD Pipeline

on:
  push:
    branches: [ main ]

concurrency:
  group: android-ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ====================================================
  # CABANG UTAMA (ROOT): VERSION GENERATOR
  # ====================================================
  prepare-version:
    name: 1. Generate App Version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.versioning.outputs.version_name }}
      tag_name: ${{ steps.versioning.outputs.tag_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Version (vYY.MM.BUILD)
        id: versioning
        run: |
          YEAR=$(date +'%y')
          MONTH=$(date +'%m')
          BUILD_NUM=${{ github.run_number }}
          
          VERSION_NAME="${YEAR}.${MONTH}.${BUILD_NUM}"
          TAG_NAME="v${VERSION_NAME}"
          
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

  # ====================================================
  # CABANG PARALEL A: BUILD .NET MAUI APK
  # ====================================================
  build-maui-apk:
    name: 2a. Build .NET MAUI APK
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui-android

      - name: Compile Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          dotnet restore apps/mobile/HypenMaui.csproj -p:TargetFramework=net10.0-android
          
          dotnet build apps/mobile/HypenMaui.csproj -c Release -f net10.0-android --no-restore \
            -p:ApplicationDisplayVersion="${{ needs.prepare-version.outputs.version_name }}" \
            -p:ApplicationVersion="${{ github.run_number }}" \
            -p:LastFmApiKey="${LASTFM_API_KEY:-dummy_key}" \
            -p:LastFmApiSecret="${LASTFM_API_SECRET:-dummy_secret}" \
            -p:GoogleClientId="${GOOGLE_CLIENT_ID:-dummy_client_id}" \
            -p:GoogleClientSecret="${GOOGLE_CLIENT_SECRET:-dummy_client_secret}"

      - name: Upload Unvalidated Raw APK
        uses: actions/upload-artifact@v4
        with:
          name: raw-maui-apk
          path: apps/mobile/bin/Release/net10.0-android/*.apk
          retention-days: 1

  # ====================================================
  # CABANG PARALEL B: GENERATE CHANGELOG (FIX ERROR DI SINI)
  # ====================================================
  generate-release-notes:
    name: 2b. Generate Changelog & Notes
    needs: prepare-version
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.notes.outputs.body }}
    steps:
      - name: Draft Release Notes (Multiline Fix)
        id: notes
        run: |
          {
            echo "body<<EOF"
            echo "### 🚀 Release Highlights"
            echo "- Offline Local Music Vault Player"
            echo "- Personal Cloud Vault (Google Drive & TeraBox Integration)"
            echo "- Integrated Last.fm Scrobbler"
            echo "- AppShell Navigation Bar System"
            echo "- Automatic In-App Updating"
            echo "EOF"
          } >> $GITHUB_OUTPUT

  # ====================================================
  # CABANG PARALEL C: BUILD SUMMARY & METRICS
  # ====================================================
  generate-build-summary:
    name: 2c. Prepare Build Metadata
    needs: prepare-version
    runs-on: ubuntu-latest
    outputs:
      build_meta: ${{ steps.meta.outputs.meta }}
    steps:
      - name: Create Metadata String
        id: meta
        run: |
          META_TEXT="Build ID: ${{ github.run_number }} | Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}"
          echo "meta=${META_TEXT}" >> $GITHUB_OUTPUT

  # ====================================================
  # CABANG SEKUENSIAL: VALIDATE & SANITY CHECK APK
  # ====================================================
  validate-apk-integrity:
    name: 3. Validate APK Integrity
    needs: [prepare-version, build-maui-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Download Raw APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: raw-maui-apk
          path: build-output

      - name: Run Size & Sanity Check
        run: |
          mkdir -p release-assets
          
          APK_FILE=$(ls build-output/*-Signed.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(ls build-output/*.apk 2>/dev/null | head -n 1)
          fi

          if [ -z "$APK_FILE" ]; then
            echo "::error::File APK tidak ditemukan!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_FILE")
          echo "APK Found: $APK_FILE ($FILE_SIZE bytes)"
          
          if [ $FILE_SIZE -lt 10485760 ]; then
            echo "::error::Ukuran APK terlalu kecil ($FILE_SIZE bytes)!"
            exit 1
          fi

          cp "$APK_FILE" "release-assets/HypenVault-${{ needs.prepare-version.outputs.tag_name }}.apk"

      - name: Upload Final Validated Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hypen-Vault-MAUI-APK
          path: release-assets/*.apk

  # ====================================================
  # KOTAK AKHIR (CONVERGENCE): PUBLISH RELEASE
  # ====================================================
  publish-github-release:
    name: 4. Publish to GitHub Releases
    needs: [prepare-version, validate-apk-integrity, generate-release-notes, generate-build-summary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Final APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Hypen-Vault-MAUI-APK
          path: release-assets

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag_name }}
          name: Hypen Vault ${{ needs.prepare-version.outputs.tag_name }}
          body: |
            **Version:** ${{ needs.prepare-version.outputs.tag_name }}
            **Metadata:** ${{ needs.generate-build-summary.outputs.build_meta }}

            ${{ needs.generate-release-notes.outputs.release_body }}
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
