<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hypen Vault Player</title>

    <!-- Path base href mengarah ke subfolder repository GitHub Pages -->
    <base href="/hypen/" />
    
    <!-- Favicon langsung mengambil dari GitHub Raw (folder apps/mobile) -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/rdmmoonlight/hypen/main/apps/mobile/Resources/AppIcon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="theme.css?v=7.0" />
</head>

<body>
    <!-- Target Mounting Blazor WASM -->
    <div id="app">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; color: #4cc9f0; font-family: sans-serif;">
            <h3>Memuat Hypen Vault Player...</h3>
        </div>
    </div>

    <!-- UI Handler Error Bawaan Blazor -->
    <div id="blazor-error-ui" style="display: none;">
        Terjadi kesalahan yang tidak ditangani.
        <a href="" class="reload">Muat Ulang</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Helper JS Interop untuk Download File -->
    <script>
        window.triggerFileDownload = (url, fileName) => {
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = fileName || 'download';
            anchor.target = '_blank';
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        };
    </script>

    <!-- Script Utama Runtime Blazor WASM -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
