<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hypen Vault Player</title>
    <base href="/" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="theme.css?v=7.0" />
</head>

<body>
    <!-- Target Mounting Blazor WASM -->
    <div id="app">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; color: #4cc9f0; font-family: sans-serif;">
            <h3>Memuat Hypen Vault Player...</h3>
        </div>
    </div>

    <div id="blazor-error-ui" style="display: none;">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Script Utama Runtime Blazor WASM -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Helper JS Interop untuk Download File -->
    <script>
        window.triggerFileDownload = (url, fileName) => {
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = fileName || 'download';
            anchor.target = '_blank';
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
        };
    </script>
</body>
</html>
