<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hypen Vault Player</title>
  
  <!-- Font Google Nebula / Space -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- File Tema CSS -->
  <link rel="stylesheet" href="theme.css?v=4.0">

  <!-- Inject config dari GitHub Actions (Optional Load) -->
  <script>
    // Inisialisasi variabel global agar tidak error jika config.js absen
    window.ENV_BACKEND_URL = window.ENV_BACKEND_URL || "";
  </script>
  <script src="config.js" async onerror="console.log('config.js tidak ditemukan, menggunakan fallback URL')"></script>
</head>
<body>

  <!-- Container Utama -->
  <main class="main-container">
    <!-- Input Single Track -->
    <div class="input-group">
      <h3 class="nebula-title">Import Single Track</h3>
      <div class="input-inline">
        <input type="text" id="ytUrl" placeholder="Tempel link video YouTube...">
        <button class="btn-nebula" onclick="convertVideo()">+ Add Track</button>
      </div>
    </div>

    <!-- Input Playlist YouTube -->
    <div class="input-group">
      <h3 class="nebula-title">Import YouTube Playlist</h3>
      <div class="input-inline">
        <input type="text" id="playlistUrl" placeholder="Tempel link playlist YouTube...">
        <button class="btn-nebula btn-secondary" onclick="convertPlaylist()">+ Import Playlist</button>
      </div>
    </div>

    <p id="status" class="status-msg"></p>

    <h3 class="nebula-title section-header">Library Collection</h3>
    <div id="libraryList" class="card-grid"></div>
  </main>

  <!-- Player Bar di Bawah -->
  <div class="player-bar">
    <div id="nowPlaying" class="now-playing">No track selected...</div>
    <audio id="audioPlayer" controls></audio>
  </div>

  <script>
    // Fungsi mendapatkan Backend URL secara dinamis
    function getBackendUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return window.ENV_BACKEND_URL || urlParams.get('api') || "https://hypen-0s65.onrender.com";
    }

    function setStatus(msg, isError = false) {
      const statusEl = document.getElementById('status');
      statusEl.innerText = msg;
      statusEl.style.color = isError ? '#f72585' : '#4cc9f0';
    }

    // 1. Fetch Library
    async function loadLibrary() {
      const baseUrl = getBackendUrl();
      try {
        setStatus('Memuat library...');
        const res = await fetch(`${baseUrl}/api/songs`);
        
        if (!res.ok) {
          throw new Error(`Server responding with status ${res.status}`);
        }

        const songs = await res.json();
        const container = document.getElementById('libraryList');
        container.innerHTML = '';

        if (!Array.isArray(songs) || songs.length === 0) {
          setStatus('Library masih kosong.');
          return;
        }

        songs.forEach(song => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${song.Cover || ''}" class="card-img" alt="Cover" onerror="this.src='https://via.placeholder.com/50'">
            <div class="card-info">
              <div class="card-title">${song.Title}</div>
              <div class="card-artist">${song.Artist}</div>
            </div>
            <button class="btn-nebula" onclick="playSong('${song.AudioUrl}', '${song.Title.replace(/'/g, "\\'")}', '${song.Artist.replace(/'/g, "\\'")}', '${song.Cover}')">▶ Play</button>
          `;
          container.appendChild(card);
        });

        setStatus(''); // Clear status jika sukses
      } catch (e) {
        console.error("Fetch Library Error:", e);
        setStatus(`Gagal memuat library (${e.message}). Coba refresh halaman.`, true);
      }
    }

    // 2. Add Single Video
    async function convertVideo() {
      const url = document.getElementById('ytUrl').value;
      if (!url) return alert('Masukkan URL YouTube!');

      setStatus('Memproses track...');
      const baseUrl = getBackendUrl();
      try {
        const res = await fetch(`${baseUrl}/api/convert`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ youtubeUrl: url })
        });
        if (res.ok) {
          setStatus('Track berhasil ditambahkan!');
          document.getElementById('ytUrl').value = '';
          loadLibrary();
        } else {
          setStatus('Gagal memproses video.', true);
        }
      } catch (e) {
        setStatus('Gagal mengonversi video.', true);
      }
    }

    // 3. Add Playlist
    async function convertPlaylist() {
      const url = document.getElementById('playlistUrl').value;
      if (!url) return alert('Masukkan URL Playlist!');

      setStatus('Mengimpor seluruh playlist YouTube...');
      const baseUrl = getBackendUrl();
      try {
        const res = await fetch(`${baseUrl}/api/convert-playlist`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ playlistUrl: url })
        });
        const data = await res.json();
        if (res.ok) {
          setStatus(`Berhasil mengimpor ${data.TotalAdded} lagu dari playlist!`);
          document.getElementById('playlistUrl').value = '';
          loadLibrary();
        } else {
          setStatus('Gagal mengimpor playlist.', true);
        }
      } catch (e) {
        setStatus('Gagal mengimpor playlist.', true);
      }
    }

    // 4. Playback & Lockscreen Integration
    function playSong(url, title, artist, cover) {
      const player = document.getElementById('audioPlayer');
      document.getElementById('nowPlaying').innerText = `PLAYING: ${title} - ${artist}`;

      player.src = url;
      player.play();

      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: title,
          artist: artist,
          artwork: [{ src: cover, sizes: '512x512', type: 'image/jpeg' }]
        });
      }
    }

    // Init App
    loadLibrary();
  </script>
</body>
</html>
