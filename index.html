<script>
  const BACKEND_URL = "https://hypen-0s65.onrender.com";

  // 1. Fetch Library
  async function loadLibrary() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/songs`);
      const songs = await res.json();
      
      const container = document.getElementById('libraryList');
      container.innerHTML = '';

      songs.forEach(song => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${song.Cover}" class="card-img" alt="Cover">
          <div class="card-info">
            <div class="card-title">${song.Title}</div>
            <div class="card-artist">${song.Artist}</div>
          </div>
          <button class="btn-gothic" onclick="playSong('${song.AudioUrl}', '${song.Title.replace(/'/g, "\\'")}', '${song.Artist.replace(/'/g, "\\'")}', '${song.Cover}')">▶ Play</button>
        `;
        container.appendChild(card);
      });
    } catch (e) {
      document.getElementById('status').innerText = 'Gagal memuat library.';
    }
  }

  // 2. Add Single Video
  async function convertVideo() {
    const url = document.getElementById('ytUrl').value;
    const status = document.getElementById('status');
    if (!url) return alert('Masukkan URL YouTube!');

    status.innerText = 'Memproses track...';
    try {
      const res = await fetch(`${BACKEND_URL}/api/convert`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ youtubeUrl: url })
      });
      if (res.ok) {
        status.innerText = 'Track berhasil ditambahkan!';
        document.getElementById('ytUrl').value = '';
        loadLibrary();
      }
    } catch (e) {
      status.innerText = 'Gagal mengonversi video.';
    }
  }

  // 3. Add Playlist
  async function convertPlaylist() {
    const url = document.getElementById('playlistUrl').value;
    const status = document.getElementById('status');
    if (!url) return alert('Masukkan URL Playlist!');

    status.innerText = 'Mengimpor seluruh playlist YouTube...';
    try {
      const res = await fetch(`${BACKEND_URL}/api/convert-playlist`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playlistUrl: url })
      });
      const data = await res.json();
      if (res.ok) {
        status.innerText = `Berhasil mengimpor ${data.TotalAdded} lagu dari playlist!`;
        document.getElementById('playlistUrl').value = '';
        loadLibrary();
      }
    } catch (e) {
      status.innerText = 'Gagal mengimpor playlist.';
    }
  }

  // 4. Playback & Lockscreen Integration
  function playSong(url, title, artist, cover) {
    const player = document.getElementById('audioPlayer');
    document.getElementById('nowPlaying').innerText = `Playing: ${title} - ${artist}`;

    player.src = url;
    player.play();

    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: title,
        artist: artist,
        artwork: [{ src: cover, sizes: '512x512', type: 'image/jpeg' }]
      });
    }
  }

  // Init App
  loadLibrary();
</script>
